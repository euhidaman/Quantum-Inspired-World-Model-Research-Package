   <g id="text_1">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #45576a" x="36" y="76.977638" transform="rotate(-0 36 76.977638)">PRISMA-style layout for the curated set only. Complete discovery and independent-study counts are unavailable.</text>
